<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap">
<style>

:root[data-theme="dark"]{--bg:#121318;--cd:#1F222E;--tx:#EEF0F6;--mu:#8B90A3;--ln:#2C3040;--sh:0 8px 24px rgba(0,0,0,.35);--hd:rgba(18,19,24,.97);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:transparent;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,rgba(99,102,241,.22),transparent),radial-gradient(35% 35% at 85% 10%,rgba(16,185,129,.18),transparent),radial-gradient(40% 40% at 70% 90%,rgba(244,63,94,.14),transparent)}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,#q:focus{outline:2px solid var(--i);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:var(--hd);border-bottom:1px solid var(--ln)}
.br{font:800 21px/1 "Outfit",system-ui,sans-serif;letter-spacing:-.02em;margin-right:auto;background:linear-gradient(90deg,var(--g),var(--i),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{background:var(--cd);border:1px solid var(--ln);border-radius:14px;width:40px;height:40px;flex:none;font-size:18px;box-shadow:var(--sh);transition:transform .15s}
.ib:active{transform:scale(.92)}
#q{flex:1 1 220px;min-width:0;height:40px;border-radius:14px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);padding:0 14px;font-size:15px;box-shadow:var(--sh)}
.pill{flex:none;background:linear-gradient(135deg,var(--g),var(--i));color:#fff;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 6px 18px rgba(99,102,241,.35)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none;max-width:1100px;margin:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--cd);border-radius:999px;padding:8px 15px;font-weight:600;color:var(--mu);transition:.2s}
.chip.on{background:linear-gradient(135deg,var(--i),var(--g));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(99,102,241,.35)}
#sb{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:82vw;background:var(--cd);z-index:20;transform:translateX(-100%);transition:transform .3s;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;box-shadow:var(--sh)}
#sb.open{transform:none}
#sb h3{margin:0 0 14px 6px;font:800 22px "Outfit",system-ui,sans-serif}
#sb button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:13px 14px;color:var(--mu);font-weight:600}
#sb button.on{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(16,185,129,.14));color:var(--tx)}
.vl{margin:auto 0 10px 6px;display:flex;gap:10px;align-items:center}
#sc{position:fixed;inset:0;background:rgba(5,6,15,.55);z-index:19;opacity:0;pointer-events:none;transition:opacity .3s}
#sc.open{opacity:1;pointer-events:auto}
main{padding:12px 14px 30px;max-width:1100px;margin:auto}
h2{margin:8px 2px 14px;font:700 20px "Outfit",system-ui,sans-serif;letter-spacing:-.01em}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:22px;overflow:hidden;padding:0;text-align:left;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s;animation:up .5s both}
.cd:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(60,70,160,.22)}.cd:active{transform:scale(.96)}
.th{height:122px;display:grid;place-items:center;font-size:50px;position:relative;overflow:hidden}
.th::before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.4),transparent 70%);top:-30px;left:-16px}
.th::after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.28),transparent 70%);bottom:-30px;right:-10px}
.th i{font-style:normal;position:relative;z-index:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.cd:hover .th i{animation:fl 3s ease-in-out infinite}
.rt{position:absolute;z-index:2;top:10px;right:10px;background:rgba(16,185,129,.92);color:#fff;font-weight:800;font-size:12px;border-radius:10px;padding:3px 8px}
.bd{padding:12px 14px 14px}.bd b{display:block;font-size:14px;line-height:1.25}
.tg{display:inline-block;font-size:11px;color:var(--mu);border:1px solid var(--ln);border-radius:999px;padding:1px 8px;margin:6px 4px 0 0}
@keyframes bg{50%{background-position:100% 100%}}
@keyframes fl{50%{transform:translateY(-6px) scale(1.08)}}
@keyframes in{from{opacity:0;transform:scale(.97)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.dpb{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:16px;padding:20px 18px;margin:8px 0 6px;border:0;border-radius:26px;text-align:left;color:#fff;font:700 17px "Outfit",system-ui,sans-serif;text-shadow:0 1px 8px rgba(0,0,0,.5);box-shadow:0 14px 34px rgba(60,70,160,.3)}
.dpb::after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%)}
.dpb i{font-size:58px;font-style:normal;position:relative;z-index:1;animation:fl 3s ease-in-out infinite}
.dpb span{position:relative;z-index:1}.dpb small{display:block;font:500 12px system-ui,sans-serif;opacity:.9;margin-bottom:2px;text-transform:uppercase;letter-spacing:.08em}
.pl{margin-left:auto;font-style:normal;font-size:13px;position:relative;z-index:1;background:rgba(255,255,255,.25);border-radius:999px;padding:9px 15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--g) var(--p,0%),var(--ln) var(--p,0%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35),0 0 0 4px rgba(16,185,129,.35)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35),0 0 0 4px rgba(16,185,129,.35)}
#ov{--bg:#121318;--cd:#1F222E;--tx:#EEF0F6;--mu:#8B90A3;--ln:#2C3040;--sh:0 8px 24px rgba(0,0,0,.35);color:var(--tx);position:fixed;inset:0;z-index:30;background:#0B0C10;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ov.on{display:flex;animation:in .25s}
#ab{display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(31,34,46,.95);border-bottom:1px solid rgba(255,255,255,.06);z-index:4}

#st{flex:1;position:relative;overflow:hidden}

#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ux{position:absolute;inset:0;z-index:2;overflow:auto;padding:20px;display:none}
#bar{position:absolute;z-index:3;left:0;right:0;bottom:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px;pointer-events:none}

#hint{position:absolute;z-index:3;top:12px;left:50%;transform:translateX(-50%);max-width:90%;background:rgba(20,22,32,.6);color:#cbd0e4;font-size:13px;padding:6px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint:empty{display:none}
#tt{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:linear-gradient(135deg,var(--i),var(--g));color:#fff;font-weight:600;padding:11px 18px;border-radius:999px;z-index:40;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;box-shadow:0 10px 28px rgba(0,0,0,.35)}
#tt.on{opacity:1;transform:translate(-50%,0)}
.mx,.md{max-width:440px;margin:24px auto 150px}
.mx h2,.md h2{text-align:center}
.sl{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:14px 16px 18px;margin:12px 0;box-shadow:var(--sh)}
.sh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px}.sh b{color:var(--g)}
.md{text-align:center}.em{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.em button{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:14px 6px;font-size:34px;width:78px;transition:.2s;box-shadow:var(--sh)}
.em button:hover{transform:translateY(-4px) scale(1.06);border-color:var(--g)}
.em small{display:block;font-size:11px;color:var(--mu);margin-top:2px}
#mr{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-top:10px}#mr:empty{display:none}
.go{background:linear-gradient(135deg,var(--g),var(--i));color:#fff;border:0;border-radius:999px;padding:13px 26px;font-weight:800;box-shadow:0 8px 22px rgba(99,102,241,.4)}
.inp{width:100%;height:48px;border-radius:16px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);padding:0 14px;font-size:16px}
body.play::before,body.play main *,body.play .chips *{animation:none!important}
.rm *{animation:none!important;transition:none!important}
.rcl{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.rci{flex:none;width:64px;height:64px;border-radius:18px;border:0;font-size:30px;box-shadow:var(--sh)}
.fv{position:absolute;z-index:3;top:8px;left:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;background:rgba(0,0,0,.28)}
#shw{position:fixed;inset:0;z-index:70;background:rgba(5,6,15,.6);display:none;align-items:flex-end;justify-content:center}
#shw.on{display:flex}
#shs{position:relative;width:100%;max-width:480px;max-height:86vh;overflow:auto;background:var(--cd);color:var(--tx);border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s}
#shs h3{margin:0 0 6px;font:800 22px "Outfit",system-ui,sans-serif}#shs h4{margin:16px 0 6px}
.shx{position:absolute;top:12px;right:12px;width:34px;height:34px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.sg div{background:var(--bg);border-radius:16px;padding:12px;text-align:center}.sg b{display:block;font-size:24px}.sg small{color:var(--mu);font-size:11px}
.bdg{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;margin:6px 0;background:var(--bg);opacity:.45;filter:grayscale(1)}
.bdg.on{opacity:1;filter:none;border:1px solid var(--g)}.bdg span{font-size:24px}
.rw{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--ln)}
.rw input[type=checkbox]{width:22px;height:22px;accent-color:var(--g)}
.lg{display:flex;gap:6px}.lg button{border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:6px 11px;font-weight:700}.lg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.stars{display:flex;gap:6px;justify-content:center;margin:14px 0}.stars button{background:none;border:0;font-size:36px}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}.dots i{width:8px;height:8px;border-radius:99px;background:var(--ln)}.dots i.on{background:var(--g);width:22px}
#shs .go{margin-top:10px;width:100%}
#sp{position:fixed;inset:0;z-index:60;background:#090a14;color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(26px + env(safe-area-inset-top,0px)) 22px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;transition:opacity .4s}
#sp.off{opacity:0;pointer-events:none}
.spb{text-align:center}.spb .cr{font-size:30px}
#sp h1{margin:0;font:800 clamp(44px,13vw,64px)/1.05 "Outfit",system-ui,sans-serif;letter-spacing:-.03em}
#sp h1 em{font-style:normal;background:linear-gradient(90deg,#8b5cf6,#6366f1,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
#sp p{margin:8px 0 0;letter-spacing:.26em;font-size:12px;color:#aab0cf}
#sp svg{width:100%;max-width:420px;flex:1;min-height:170px;margin:14px 0;border-radius:24px}
.st0{width:100%;max-width:420px;border:0;border-radius:999px;padding:18px;font:700 20px "Outfit",system-ui,sans-serif;color:#fff;background:linear-gradient(90deg,#7c3aed,#4f8cff);box-shadow:0 14px 36px rgba(99,102,241,.5)}
.sr{display:flex;gap:26px;margin:18px 0 12px}.sr button{background:none;border:0;color:#aab0cf;font-size:13px;display:grid;justify-items:center;gap:6px}
.sr i{font-style:normal;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#171a2e;border:1px solid #2a2f4d}
.tgs{display:flex;gap:18px;color:#8b93ff;font-size:12px;flex-wrap:wrap;justify-content:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===== 14. Hourglass Focus Timer ===== */
function hourglass(cv,c,S,api){
 const D=[1,5,15];let di=1,T=300,t=0,run=false,done=false;
 api.btn('Start / Pause',()=>{if(done){t=0;done=false}run=!run});
 api.btn('5 min',b=>{di=(di+1)%3;T=D[di]*60;t=0;run=false;done=false;b.textContent=D[di]+' min'});
 return{f(dt){
  if(run){t+=dt;if(t>=T){t=T;run=false;done=true;tone(220,8,'sine',.12);tone(607,5,'sine',.05);api.pt(10)}}
  c.fillStyle='#121318';c.fillRect(0,0,S.w,S.h);
  const cx=S.w/2,cy=S.h/2-10,w=Math.min(S.w*.32,130),h=Math.min(S.h*.32,190),p=t/T;
  const path=()=>{c.beginPath();c.moveTo(cx-w,cy-h);c.lineTo(cx+w,cy-h);c.lineTo(cx+8,cy);c.lineTo(cx+w,cy+h);c.lineTo(cx-w,cy+h);c.lineTo(cx-8,cy);c.closePath()};
  c.save();path();c.clip();c.fillStyle='#FBBF24';
  c.fillRect(cx-w,cy-h*(1-p),w*2,h*(1-p));
  c.fillRect(cx-w,cy+h-h*p,w*2,h*p);
  if(run)c.fillRect(cx-1.5,cy,3,h-h*p);
  c.restore();
  c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=3;path();c.stroke();
  const rem=Math.ceil(T-t);c.fillStyle='#fff';c.textAlign='center';c.font='700 28px system-ui,sans-serif';
  c.fillText(done?'Done 🌿':Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0'),cx,cy+h+50);
 }}}

function lava(cv,c,S,api){
 const W=64,H=Math.max(40,Math.round(W*S.h/S.w)),B=[],sm=document.createElement('canvas');sm.width=W;sm.height=H;
 const sx=sm.getContext('2d'),im=sx.createImageData(W,H);
 for(let i=0;i<7;i++)B.push({x:R(.25,.75),y:R(.1,.9),r:R(.09,.16),vy:R(.03,.07)*(Math.random()<.5?-1:1),ph:R(0,6.28)});
 cv.onpointerdown=e=>{B.push({x:e.offsetX/S.w,y:e.offsetY/S.h,r:R(.08,.13),vy:-.06,ph:R(0,6.28)});if(B.length>12)B.shift();tone(note(R(0,10)|0)/2,1.5,'sine',.08);api.pt(1)};
 return{f(dt,t){
  const m=Math.min(S.w,S.h),P=B.map(b=>{b.y+=b.vy*dt;b.x+=Math.sin(t*.5+b.ph)*.02*dt;if(b.y<.08)b.vy=Math.abs(b.vy);if(b.y>.92)b.vy=-Math.abs(b.vy);return[b.x*S.w,b.y*S.h,(b.r*m)**2]});
  const d=im.data;
  for(let j=0;j<H;j++){const y=j/H,py=y*S.h;for(let i=0;i<W;i++){let f=0;const px=i/W*S.w;
   for(const q of P){const dx=px-q[0],dy=py-q[1];f+=q[2]/(dx*dx+dy*dy+1)}
   const k=Math.min(1,Math.max(0,(f-.4)*1.6)),o=(j*W+i)*4;
   d[o]=18+226*k;d[o+1]=19+(44+120*y)*k;d[o+2]=24+(70+60*y)*k;d[o+3]=255}}

 }}}

 for(let i=0;i<45;i++)F.push({x:R(0,S.w),y:R(0,S.h),vx:R(-20,20),vy:R(-20,20),p:R(0,6.28),s:R(.6,1.6)});
 cv.onpointerdown=e=>{dn=true;tx=e.offsetX;ty=e.offsetY;tone(note(R(0,10)|0)*2,1,'sine',.04);api.pt(1)};

   c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=1;c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(p[2],p[3]);c.stroke();

$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():$('ov').requestFullscreen()}catch(e){}};
addEventListener('resize',()=>{if($('ov').classList.contains('on'))fit()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('ov').classList.contains('on'))closeApp()});
let strk=1;
(()=>{const d=new Date().toDateString(),s=ST.get('chs',{d:'',n:0});if(s.d!==d){const y=new Date(Date.now()-864e5).toDateString();s.n=s.d===y?s.n+1:1;s.d=d;ST.set('chs',s)}strk=s.n;$('sk').textContent=strk})();
function openSheet(h){$('shc').innerHTML=h;$('shw').classList.add('on')}
$('shw').onclick=e=>{if(e.target.id=='shw'||e.target.closest('.shx'))$('shw').classList.remove('on')};
function share(){const tx='ChillHop 🎧 · '+pts+' ⚡ · 🔥 '+strk;if(navigator.share)navigator.share({title:'ChillHop',text:tx,url:location.href}).catch(()=>{});else{try{navigator.clipboard.writeText(tx+' '+location.href);toast('📋 Copied')}catch(e){toast(tx)}}}
function sheetStats(){const U=ST.get('ach',[]);
 openSheet('<h3>'+T('stats')+'</h3><div class="sg"><div><b>'+pts+'</b><small>'+T('pts')+'</small></div><div><b>'+strk+'</b><small>'+T('streak')+'</small></div><div><b>'+val('opened')+'</b><small>'+T('played')+'</small></div></div><h4>'+T('badges')+'</h4>'+BG.map((b,i)=>'<div class="bdg'+(U.includes(i)?' on':'')+'"><span>'+b[2]+'</span>'+T(b[3])+'</div>').join('')+'<button class="go" id="shr">'+T('share')+'</button>');
 $('shr').onclick=share}
function sheetSet(){
 openSheet('<h3>'+T('settings')+'</h3><label class="rw"><span>'+T('vib')+'</span><input type="checkbox" id="s1"'+(HAP?' checked':'')+'></label><label class="rw"><span>'+T('rm')+'</span><input type="checkbox" id="s2"'+(RM?' checked':'')+'></label><div class="rw"><span>'+T('lang')+'</span><span class="lg"><button data-l="0">UZ</button><button data-l="1">EN</button><button data-l="2">RU</button></span></div><div class="rw"><span>'+T('theme')+'</span><button class="chip" id="s3">'+(isDark()?'☀️':'🌙')+'</button></div><button class="chip" id="s4" style="margin-top:16px">'+T('reset')+'</button>');
 $('s1').onchange=e=>{HAP=e.target.checked;ST.set('hap',HAP)};
 $('s2').onchange=e=>{RM=e.target.checked;ST.set('rm',RM);root.classList.toggle('rm',RM)};
 document.querySelectorAll('.lg button').forEach(b=>{b.classList.toggle('on',+b.dataset.l==LI);b.onclick=()=>{LI=+b.dataset.l;ST.set('li',LI);applyLang();sheetSet()}});
 $('s3').onclick=()=>{$('th').click();$('s3').textContent=isDark()?'☀️':'🌙'};
 let rr=0;$('s4').onclick=()=>{if(!rr){rr=1;$('s4').textContent='⚠️ '+T('reset')+'?';return}['chp','sd','ach','fav','rec','chs','mix','gl','best'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}}
function rateSheet(){openSheet('<h3>'+T('rate')+'</h3><div class="stars">'+[1,2,3,4,5].map(n=>'<button data-n="'+n+'">'+(n<=ST.get('rate',0)?'⭐':'☆')+'</button>').join('')+'</div>');
 document.querySelectorAll('.stars button').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;ST.set('rate',n);document.querySelectorAll('.stars button').forEach(x=>x.textContent=+x.dataset.n<=n?'⭐':'☆');toast(T('thanks'))})}
const OB=[['🌧️','ob1'],['🎧','ob2'],['🏆','ob3']];
function onboard(k=0){if(k>=3){ST.set('ob',1);$('shw').classList.remove('on');return}
 openSheet('<div style="text-align:center"><div style="font-size:64px">'+OB[k][0]+'</div><h3>'+T(OB[k][1]+'t')+'</h3><p style="color:var(--mu)">'+T(OB[k][1]+'d')+'</p><div class="dots">'+[0,1,2].map(i=>'<i'+(i==k?' class="on"':'')+'></i>').join('')+'</div><button class="go" id="obn">'+T(k<2?'next':'go')+'</button></div>');
 $('obn').onclick=()=>onboard(k+1)}
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));$('q').placeholder=T('search');root.lang=['uz','en','ru'][LI];nav();render()}
$('sp1').onclick=sheetSet;$('sp2').onclick=sheetStats;$('sp3').onclick=rateSheet;
$('go0').onclick=()=>{$('sp').classList.add('off');document.body.classList.remove('play');setTimeout(()=>{$('sp').style.display='none';if(!ST.get('ob',0))onboard()},400)};
if(RM)root.classList.add('rm');
applyLang();
</script>
</body>
</html>
